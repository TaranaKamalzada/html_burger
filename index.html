<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>burger</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        .container {
            width: 96%;
            height: 95vh;
            margin: 0 auto;
            margin-top: 0;
            background-color: white;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
        }

        /* NAVBAR */

        header {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            width: 73px;
            height: 58px;
            background-color: #d92d05;
            margin-left: 70px;
            border-radius: 0 0 5px 5px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: 16px;
            line-height: 14px;
            text-align: center;
        }

        nav {
            margin-left: auto;
            margin-right: 65px;
            display: flex;
            align-items: center;
            gap: 55px;
        }

        nav a {
            text-decoration: none;
            color: #888;
            font-size: 16px;
            font-weight: 600;
        }

        nav a:first-child {
            color: #e64b08;
        }

        .social {
            display: flex;
            gap: 18px;
            margin-left: 30px;
        }

        .social span {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }


        /* NARINCI SAĞ HİSSƏ */

        .orange {
            position: absolute;
            right: 0;
            top: 0;

            width: 39%;
            height: 100%;

            background: linear-gradient(
                135deg,
                #e85b00,
                #ff9637
            );

            border-radius: 0 25px 25px 0;
        }


        /* YAZI HİSSƏSİ */

        .content {
            position: absolute;
            left: 70px;
            top: 250px;
            z-index: 5;
        }

        .content p {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #111;
        }

        .content h1 {
            font-family: Georgia, serif;
            font-size: 62px;
            line-height: 0.95;
            color: #762b13;
            margin-bottom: 38px;
        }

        .content h1 span {
            color: #e95a00;
        }

        .content button {
            border: none;
            background-color: #e95a00;
            color: white;

            padding: 15px 18px;

            border-radius: 6px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .content button:hover {
            background-color: #c94600;
        }


        /* BURGER */

        .burger {
            position: absolute;

            width: 500px;
            height: 500px;

            right: 20%;
            top: 145px;

            z-index: 5;

            background-image: url("./Group\ 1.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }


        /* RESPONSIVE */

        @media (max-width: 900px) {

            .container {
                height: 100vh;
                width: 100%;
                border-radius: 0;
            }

            .orange {
                width: 100%;
                height: 50%;
                top: 50%;
                border-radius: 0;
            }

            nav {
                gap: 20px;
                margin-right: 20px;
            }

            .logo {
                margin-left: 20px;
            }

            .content {
                left: 40px;
                top: 150px;
            }

            .content h1 {
                font-size: 45px;
            }

            .burger {
                width: 400px;
                height: 400px;
                right: 50%;
                transform: translateX(50%);
                top: 45%;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- Narıncı arxa hissə -->
        <div class="orange"></div>


        <!-- Navbar -->
        <header>

            <div class="logo">
                Gnam<br>
                Gnam.
            </div>

            <nav>

                <a href="#">Panini</a>

                <a href="#">Kebab</a>

                <a href="#">Dolci</a>

                <a href="#" style="color: white;">Contattaci</a>

                <div class="social">
                    <img src="Vector (5).png" alt="">
              <img src="Vector (6).png" alt="">
                 <img src="Vector (7).png" alt="">
                </div>

            </nav>

        </header>


        <!-- Sol tərəfdəki yazılar -->
        <div class="content">

            <p>Prova il nuovo</p>

            <h1>
                Cheesy<br>
                <span>Bluster</span>
            </h1>

            <button>
                Scopri gli ingredienti
            </button>

        </div>


        <!-- Burger -->
        <div class="burger"></div>

    </div>

</body>
</html>
